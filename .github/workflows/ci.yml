name: Backend - build and verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  h2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify SDD artifacts and repository hygiene
        run: python3 tools/check_repository.py
      - name: Compile and run tests (H2)
        run: mvn -B -ntp verify
      - name: Store test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-h2
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: trabajaya_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: ci-temporary-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/trabajaya_test
      TEST_DB_USERNAME: test_user
      TEST_DB_PASSWORD: ci-temporary-only
      TEST_DB_DRIVER: org.postgresql.Driver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify migrations and API against PostgreSQL
        run: mvn -B -ntp verify
      - name: Store test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-postgres
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14

  docker:
    needs: [h2, postgres]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image without external credentials
        run: docker build --tag trabajaya-backend:ci .
