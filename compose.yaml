services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: trabajaya
      POSTGRES_USER: trabajaya
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Create .env with DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - trabajaya-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trabajaya -d trabajaya"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  trabajaya-data:
