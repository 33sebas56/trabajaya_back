# Cloud overrides. Activate together with postgres; secrets come only from Render.
server.address=0.0.0.0
server.port=${PORT:10000}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
app.storage.provider=${STORAGE_PROVIDER:supabase}
app.seed.enabled=${DEMO_SEED:false}
app.reset.console=false
management.health.mail.enabled=${MAIL_ENABLED:false}
spring.flyway.clean-disabled=true
server.tomcat.threads.max=30
server.tomcat.threads.min-spare=2
