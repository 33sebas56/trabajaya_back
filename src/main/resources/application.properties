spring.application.name=trabajaya
server.port=${PORT:8080}
spring.profiles.default=local
spring.jackson.time-zone=America/Bogota
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.flyway.enabled=true
spring.sql.init.mode=never
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
app.cors-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.storage.provider=${STORAGE_PROVIDER:local}
app.storage.directory=${STORAGE_DIRECTORY:./uploads}
app.supabase.url=${SUPABASE_URL:}
app.supabase.key=${SUPABASE_SERVICE_KEY:}
app.supabase.bucket=${SUPABASE_BUCKET:trabajaya-images}
app.seed.enabled=${DEMO_SEED:false}
app.auth.session-hours=12
app.pricing.poll-ms=5000
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.reset.console=false
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@trabajaya.local}

# HTTP responses never include SQL, traces or validation object internals.
server.error.include-binding-errors=never
management.health.mail.enabled=${MAIL_ENABLED:false}
spring.flyway.clean-disabled=true
app.pricing.enabled=${PRICING_ENABLED:true}
app.auth.rate-limit.enabled=${AUTH_RATE_LIMIT_ENABLED:true}
app.auth.rate-limit.source-limit=100
app.auth.rate-limit.identity-limit=20
logging.pattern.level=%5p [requestId:%X{requestId:-}]
