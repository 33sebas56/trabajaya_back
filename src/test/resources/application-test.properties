spring.config.import=
spring.datasource.url=${TEST_DB_URL:jdbc:h2:mem:trabajaya-tests;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=15000}
spring.datasource.username=${TEST_DB_USERNAME:sa}
spring.datasource.password=${TEST_DB_PASSWORD:}
spring.datasource.driver-class-name=${TEST_DB_DRIVER:org.h2.Driver}
spring.datasource.hikari.maximum-pool-size=5
app.seed.enabled=false
app.admin.email=
app.admin.password=
app.reset.console=false
app.storage.provider=local
app.storage.directory=target/test-uploads
app.pricing.enabled=false
app.auth.rate-limit.enabled=false
app.mail.enabled=false
management.health.mail.enabled=false
